name: Compilar Tinta APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y compilar web estática (dist)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Instalar Capacitor 6 y plugin de notificaciones locales
        run: |
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6

      - name: Generar proyecto Android y configurar permisos/iconos
        run: |
          npx cap add android
          node scripts/setup-android.mjs
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir Tinta-debug.apk descargable
        uses: actions/upload-artifact@v4
        with:
          name: Tinta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
